<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Объект в ауре: объект в центре, вокруг — разомкнутое кольцо системы.
       Кольцо разомкнуто и развёрнуто — знак живой, а не мишень.

       Геометрия подчинена 16 пикселям, а не красоте в крупном размере.
       Три правила, выведенные рендером на 16/20/32/96:
       · колец одно — два сливаются в пятно;
       · объект залит, а не контуром — контур на 16 px исчезает;
       · между объектом и кольцом оставлен зазор шире самого кольца,
         иначе они слипаются в кляксу. -->
  <rect width="32" height="32" rx="7" fill="#0a0f1a"/>

  <circle cx="16" cy="16" r="13.6" fill="none" stroke="#E9A94D" stroke-width="2.8"
          stroke-opacity="0.9" stroke-linecap="round"
          stroke-dasharray="71.2 14.2" transform="rotate(42 16 16)"/>

  <rect x="12.4" y="12.4" width="7.2" height="7.2" rx="1.9" fill="#E9A94D"/>
</svg>
