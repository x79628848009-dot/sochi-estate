<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Объект в ауре: объект в центре, вокруг — кольца системы. Кольца
       разомкнуты и развёрнуты вразнобой: знак живой, а не мишень. -->
  <rect width="32" height="32" rx="7" fill="#0a0f1a"/>

  <g fill="none" stroke="#E9A94D" stroke-linecap="round">
    <!-- аура: кольцо одно. Двух на 16 пикселях не видно — они сливаются в пятно -->
    <circle cx="16" cy="16" r="12" stroke-width="1.5" stroke-opacity="0.62"
            stroke-dasharray="62.8 12.6" transform="rotate(40 16 16)"/>
    <!-- объект -->
    <rect x="11.6" y="11.6" width="8.8" height="8.8" rx="2.3" stroke-width="1.8"/>
  </g>
</svg>
