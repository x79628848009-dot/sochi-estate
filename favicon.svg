<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Знак AURA: объект в разомкнутом кольце ауры. Один знак на весь домен —
       этот файл и aura/favicon.svg совпадают до символа.

       Подложки нет сознательно. На 16 пикселях подложка — единственное, что
       достаточно велико, чтобы её разглядеть, поэтому любой знак на плитке
       читается как квадрат, а не как знак. Без неё силуэт иконки — само
       кольцо, и на светлой, белой и тёмной панели вкладок это кольцо.

       Геометрия подчинена 16 пикселям, а не виду в крупном размере:
       · кольцо одно — два сливаются в пятно;
       · объект залит, а не контуром — контур на 16 px исчезает;
       · зазор между объектом и кольцом шире самого кольца, иначе слипаются.

       Правила и порядок проверки — в aura/README.md. -->

  <circle cx="16" cy="16" r="13" fill="none" stroke="#E9A94D" stroke-width="3.4"
          stroke-linecap="round" stroke-dasharray="68 13.7" transform="rotate(42 16 16)"/>

  <rect x="12.2" y="12.2" width="7.6" height="7.6" rx="2" fill="#E9A94D"/>
</svg>
